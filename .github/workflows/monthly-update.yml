name: Monthly References Update

on:
  schedule:
    # 毎月1日 09:00 JST (00:00 UTC)
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of days to look back for new cases (default: 31)'
        required: false
        default: '31'
      dry_run:
        description: 'Dry run mode (do not create PR)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run reference update agent
        id: update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '31' }}
        run: |
          python scripts/update_references.py \
            --output proposals.json \
            --lookback-days "$LOOKBACK_DAYS"

      - name: Check for proposals
        id: check
        run: |
          if [ ! -s proposals.json ]; then
            echo "No proposals generated."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          PROPOSAL_COUNT=$(python -c "import json; d=json.load(open('proposals.json')); print(len(d.get('new_ng_patterns',[])) + len(d.get('regulation_updates',[])) + len(d.get('case_studies',[])))")
          echo "proposal_count=$PROPOSAL_COUNT" >> $GITHUB_OUTPUT
          if [ "$PROPOSAL_COUNT" = "0" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply proposals
        if: steps.check.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/apply_proposals.py \
            --input proposals.json \
            --pr-body-out pr_body.md

      - name: Update CHANGELOG
        if: steps.check.outputs.has_changes == 'true'
        run: |
          python scripts/update_changelog.py --proposals proposals.json

      - name: Generate PR title
        if: steps.check.outputs.has_changes == 'true'
        id: title
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "pr_title=[auto] Monthly references update — ${DATE}" >> $GITHUB_OUTPUT
          echo "branch_name=auto/monthly-update-${DATE}-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.title.outputs.branch_name }}
          base: main
          title: ${{ steps.title.outputs.pr_title }}
          body-path: pr_body.md
          labels: |
            auto-update
            regulation
            needs-human-review
          commit-message: |
            chore(references): monthly automated update

            ${{ steps.check.outputs.proposal_count }} proposals from automated regulation monitoring.

            Run ID: ${{ github.run_id }}

      - name: Upload artifacts
        if: always() && steps.check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-artifacts-${{ github.run_id }}
          path: |
            proposals.json
            pr_body.md
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Monthly Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            echo "- ✅ Proposals: **${{ steps.check.outputs.proposal_count }}**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ PR created (or dry-run mode)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ℹ️ No new regulation/cases found this run." >> $GITHUB_STEP_SUMMARY
          fi
